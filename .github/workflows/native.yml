name: Native iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Xcode 26.6 / macOS 26
    runs-on: macos-26
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen is available
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate and inspect project
        run: |
          make project
          xcodebuild -project apps/native/SonaPin.xcodeproj -scheme SonaPin -list

      - name: Resolve Swift packages
        run: make resolve

      - name: Lint Swift and build for Simulator
        run: make lint-check

      - name: Run unit tests
        run: make test

      - name: Run UI tests
        run: make ui-test

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-diagnostics-macos-26
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/*.log
            artifacts/*.xcresult
            apps/native/.derived-data/Logs/Test/*.xcresult
